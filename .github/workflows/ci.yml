name: Integración de LumAR

on:
  pull_request:
    branches: [Luis]
  push:
    branches: [Luis, main]

permissions:
  contents: read

jobs:
  checks:
    name: Build y pruebas en Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e -- --workers=1 --reporter=line,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Guardar evidencia de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
